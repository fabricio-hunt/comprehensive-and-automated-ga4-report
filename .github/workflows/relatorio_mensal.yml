name: Gerar Relatorio Mensal SEO e Publicar no Pages

on:
  schedule:
    # Executa no dia 03 de cada mês às 08:00h (UTC 11:00)
    - cron: '0 11 3 * *'
  workflow_dispatch:
    # Permite executar manualmente com um clique na aba Actions do GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'seo_report_auto/requirements.txt'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r seo_report_auto/requirements.txt

      - name: Restaurar credenciais OAuth do Google
        env:
          GCP_TOKEN_BASE64: ${{ secrets.GCP_TOKEN_BASE64 }}
        run: |
          mkdir -p seo_report_auto/cache
          echo "$GCP_TOKEN_BASE64" | base64 --decode > seo_report_auto/cache/token.pickle

      - name: Gerar Relatório do Mês Anterior e Portal Índice
        working-directory: seo_report_auto
        run: |
          python gerar_relatorio.py --mes-anterior --no-pdf

      - name: Commit e Push dos novos relatórios para a branch main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo_report_auto/output/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada em output/."
          else
            git commit -m "chore(report): auto generate monthly SEO report and update index"
            git push origin main
          fi

      - name: Upload da pasta output como artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'seo_report_auto/output'

  deploy-pages:
    needs: gerar-relatorio
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
